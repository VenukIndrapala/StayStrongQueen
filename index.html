<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Night Sky Garden</title>
  <link rel="stylesheet" href="style.css?v=28">
</head>
<body class="not-loaded">
  <canvas id="sky-canvas"></canvas>

  <div class="shooting-star-container">
    <div class="shooting_star" style="top: 10%; left: -20%; animation-delay: 0.2s;"></div>
    <div class="shooting_star" style="top: 30%; left: -10%; animation-delay: 1.5s;"></div>
    <div class="shooting_star" style="top: 50%; left: -30%; animation-delay: 2.8s;"></div>
    <div class="shooting_star" style="top: 20%; left: 0%; animation-delay: 1.0s;"></div>
    <div class="shooting_star" style="top: 40%; left: -15%; animation-delay: 3.5s;"></div>
    <div class="shooting_star" style="top: 60%; left: -25%; animation-delay: 0.8s;"></div>
  </div>

  <div id="floating-text-layer"></div>

  <!-- Grass covering the entire black mountain hill area -->
  <div class="hill-grass-container">
    <div class="hill-grass-blade" style="left: 2%; bottom: 2px; height: 18px; animation-delay: 0.1s;"></div>
    <div class="hill-grass-blade" style="left: 5%; bottom: 5px; height: 24px; animation-delay: 0.4s;"></div>
    <div class="hill-grass-blade" style="left: 8%; bottom: 3px; height: 15px; animation-delay: 0.2s;"></div>
    <div class="hill-grass-blade" style="left: 11%; bottom: 8px; height: 28px; animation-delay: 0.6s;"></div>
    <div class="hill-grass-blade" style="left: 14%; bottom: 4px; height: 20px; animation-delay: 0.3s;"></div>
    <div class="hill-grass-blade" style="left: 18%; bottom: 6px; height: 25px; animation-delay: 0.5s;"></div>
    <div class="hill-grass-blade" style="left: 21%; bottom: 3px; height: 17px; animation-delay: 0.2s;"></div>
    <div class="hill-grass-blade" style="left: 25%; bottom: 7px; height: 30px; animation-delay: 0.7s;"></div>
    <div class="hill-grass-blade" style="left: 28%; bottom: 4px; height: 22px; animation-delay: 0.4s;"></div>
    <div class="hill-grass-blade" style="left: 31%; bottom: 6px; height: 26px; animation-delay: 0.1s;"></div>
    <div class="hill-grass-blade" style="left: 35%; bottom: 3px; height: 19px; animation-delay: 0.5s;"></div>
    <div class="hill-grass-blade" style="left: 38%; bottom: 8px; height: 27px; animation-delay: 0.3s;"></div>
    <div class="hill-grass-blade" style="left: 42%; bottom: 5px; height: 21px; animation-delay: 0.6s;"></div>
    <div class="hill-grass-blade" style="left: 45%; bottom: 2px; height: 16px; animation-delay: 0.2s;"></div>
    <div class="hill-grass-blade" style="left: 48%; bottom: 6px; height: 25px; animation-delay: 0.4s;"></div>
    <div class="hill-grass-blade" style="left: 52%; bottom: 4px; height: 22px; animation-delay: 0.7s;"></div>
    <div class="hill-grass-blade" style="left: 55%; bottom: 7px; height: 29px; animation-delay: 0.1s;"></div>
    <div class="hill-grass-blade" style="left: 58%; bottom: 3px; height: 18px; animation-delay: 0.5s;"></div>
    <div class="hill-grass-blade" style="left: 62%; bottom: 5px; height: 24px; animation-delay: 0.3s;"></div>
    <div class="hill-grass-blade" style="left: 65%; bottom: 8px; height: 26px; animation-delay: 0.6s;"></div>
    <div class="hill-grass-blade" style="left: 68%; bottom: 4px; height: 20px; animation-delay: 0.2s;"></div>
    <div class="hill-grass-blade" style="left: 72%; bottom: 6px; height: 27px; animation-delay: 0.4s;"></div>
    <div class="hill-grass-blade" style="left: 75%; bottom: 3px; height: 15px; animation-delay: 0.7s;"></div>
    <div class="hill-grass-blade" style="left: 78%; bottom: 7px; height: 30px; animation-delay: 0.1s;"></div>
    <div class="hill-grass-blade" style="left: 82%; bottom: 5px; height: 23px; animation-delay: 0.5s;"></div>
    <div class="hill-grass-blade" style="left: 85%; bottom: 2px; height: 17px; animation-delay: 0.3s;"></div>
    <div class="hill-grass-blade" style="left: 88%; bottom: 6px; height: 25px; animation-delay: 0.6s;"></div>
    <div class="hill-grass-blade" style="left: 92%; bottom: 4px; height: 21px; animation-delay: 0.2s;"></div>
    <div class="hill-grass-blade" style="left: 95%; bottom: 7px; height: 28px; animation-delay: 0.4s;"></div>
    <div class="hill-grass-blade" style="left: 98%; bottom: 3px; height: 16px; animation-delay: 0.5s;"></div>
  </div>

  <svg class="hill-scene" viewBox="0 0 800 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="figureGlow" x="-200%" y="-200%" width="500%" height="500%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="blur1">
          <animate attributeName="stdDeviation" values="1.6;2.6;1.6" dur="2.6s" repeatCount="indefinite" />
        </feGaussianBlur>
        <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur2">
          <animate attributeName="stdDeviation" values="4;5.6;4" dur="2.6s" repeatCount="indefinite" />
        </feGaussianBlur>
        <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur3">
          <animate attributeName="stdDeviation" values="7;9.5;7" dur="2.6s" repeatCount="indefinite" />
        </feGaussianBlur>
        <feMerge>
          <feMergeNode in="blur3" />
          <feMergeNode in="blur2" />
          <feMergeNode in="blur1" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>

    <!-- Rolling hill silhouette -->
    <path class="hill" d="M0,130 C120,105 220,120 330,108 C420,98 480,118 560,104 C650,89 730,108 800,96 L800,220 L0,220 Z"></path>

    <!-- Glowing couple figures standing on the hill -->
    <image href="figures.png" x="365" y="49.3" width="70" height="56" filter="url(#figureGlow)" />
  </svg>

  <!-- Complete CSS Flower Garden Component (Properly positioned at edge of hill) -->
  <div class="flowers-garden-wrapper">
    <div class="flowers">
      <div class="flower flower--1">

          <div class="flower__leaf flower__leaf--4"></div>

          <div class="flower__light flower__light--2"></div>
          <div class="flower__light flower__light--3"></div>
          <div class="flower__light flower__light--4"></div>
          <div class="flower__light flower__light--5"></div>
          <div class="flower__light flower__light--6"></div>
          <div class="flower__light flower__light--7"></div>
          <div class="flower__light flower__light--8"></div>
        </div>
        <div class="flower__line">

          <div class="flower__line__leaf flower__line__leaf--2"></div>
          <div class="flower__line__leaf flower__line__leaf--3"></div>
          <div class="flower__line__leaf flower__line__leaf--4"></div>
          <div class="flower__line__leaf flower__line__leaf--5"></div>
          <div class="flower__line__leaf flower__line__leaf--6"></div>

      </div>

          <div class="flower__light flower__light--1"></div>
          <div class="flower__light flower__light--2"></div>
          <div class="flower__light flower__light--3"></div>
          <div class="flower__light flower__light--4"></div>
          <div class="flower__light flower__light--5"></div>
          <div class="flower__light flower__light--6"></div>
          <div class="flower__light flower__light--7"></div>
          <div class="flower__light flower__light--8"></div>
        </div>
        <div class="flower__line">
          <div class="flower__line__leaf flower__line__leaf--1"></div>
          <div class="flower__line__leaf flower__line__leaf--2"></div>
          <div class="flower__line__leaf flower__line__leaf--3"></div>
          <div class="flower__line__leaf flower__line__leaf--4"></div>
        </div>
      </div>

      <div class="flower flower--3">
        <div class="flower__leafs flower__leafs--3">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__white-circle"></div>
          <div class="flower__light flower__light--1"></div>
          <div class="flower__light flower__light--2"></div>
          <div class="flower__light flower__light--3"></div>
          <div class="flower__light flower__light--4"></div>
          <div class="flower__light flower__light--5"></div>
          <div class="flower__light flower__light--6"></div>
          <div class="flower__light flower__light--7"></div>
          <div class="flower__light flower__light--8"></div>
        </div>
        <div class="flower__line">
          <div class="flower__line__leaf flower__line__leaf--1"></div>

    </div>
  </div>

  <script src="stars-sky.js?v=28"></script>
  <script src="floating-texts.js?v=28"></script>
  <script>
    window.addEventListener('load', () => {
      document.body.classList.remove('not-loaded');
    });
  </script>
</body>
</html>
