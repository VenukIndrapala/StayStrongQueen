<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Night Sky</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <canvas id="sky-canvas"></canvas>

  <svg class="hill-scene" viewBox="0 0 800 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Rolling hill silhouette -->
    <path class="hill" d="M0,130 C120,105 220,120 330,108 C420,98 480,118 560,104 C650,89 730,108 800,96 L800,220 L0,220 Z"></path>

    <!-- Signpost -->
    <g class="prop signpost" transform="translate(330,95)">
      <rect x="-2" y="0" width="4" height="34" />
      <rect x="-12" y="-6" width="24" height="14" rx="1.5" />
    </g>

    <!-- Bush -->
    <g class="prop bush" transform="translate(470,112)">
      <circle cx="0" cy="6" r="12" />
      <circle cx="-11" cy="10" r="9" />
      <circle cx="11" cy="10" r="9" />
      <circle cx="0" cy="-4" r="9" />
    </g>

    <!-- Single glowing figure, sitting hugging her knees, right on the ridge/edge -->
    <g class="prop figure figure--female" transform="translate(651,86)">
      <!-- hair, left strand -->
      <path class="hair" d="M -5.4,-23 C -11,-18 -13,-6 -11,6 C -10,11 -8,15 -6,17 C -8,10 -8,-2 -6,-12 C -5,-16 -5,-20 -5.4,-23 Z" />
      <!-- body: hunched, knees drawn up, seen from behind -->
      <path class="body" d="M -10,-8 C -13,-4 -13,4 -10,10 C -7,15 0,17 6,16 C 12,15 14,9 13,3 C 13,-3 11,-8 6,-11 C 3,-13 -6,-12 -10,-8 Z" />
      <!-- hair, right strand (shorter, side part) -->
      <path class="hair" d="M 5.4,-23 C 9,-19 10,-10 9,0 C 8.5,4 7,7 5.5,8 C 7,3 7,-6 5.5,-14 C 4.8,-18 4.8,-21 5.4,-23 Z" />
      <!-- head -->
      <circle class="head" cx="-1" cy="-19" r="6.5" />
    </g>
  </svg>

  <script src="stars-sky.js?v=5"></script>
</body>
</html>
