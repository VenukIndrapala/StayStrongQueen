<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Night Sky</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <canvas id="sky-canvas"></canvas>

  <svg class="hill-scene" viewBox="0 0 800 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Native SVG filter for the glow: renders reliably on mobile browsers,
           unlike chained CSS drop-shadow() which can get clipped/dropped on some
           mobile WebKit builds. Also pulses via SMIL <animate>. -->
      <filter id="femaleGlow" x="-200%" y="-200%" width="500%" height="500%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1">
          <animate attributeName="stdDeviation" values="2;3.2;2" dur="2.6s" repeatCount="indefinite" />
        </feGaussianBlur>
        <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur2">
          <animate attributeName="stdDeviation" values="5;7;5" dur="2.6s" repeatCount="indefinite" />
        </feGaussianBlur>
        <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur3">
          <animate attributeName="stdDeviation" values="9;12;9" dur="2.6s" repeatCount="indefinite" />
        </feGaussianBlur>
        <feMerge>
          <feMergeNode in="blur3" />
          <feMergeNode in="blur2" />
          <feMergeNode in="blur1" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>

    <!-- Rolling hill silhouette -->
    <path class="hill" d="M0,130 C120,105 220,120 330,108 C420,98 480,118 560,104 C650,89 730,108 800,96 L800,220 L0,220 Z"></path>

    <!-- Signpost -->
    <g class="prop signpost" transform="translate(330,95)">
      <rect x="-2" y="0" width="4" height="34" />
      <rect x="-12" y="-6" width="24" height="14" rx="1.5" />
    </g>

    <!-- Bush -->
    <g class="prop bush" transform="translate(470,112)">
      <circle cx="0" cy="6" r="12" />
      <circle cx="-11" cy="10" r="9" />
      <circle cx="11" cy="10" r="9" />
      <circle cx="0" cy="-4" r="9" />
    </g>

    <!-- Glowing figure, sitting hugging her knees, midway between signpost and bush -->
    <g class="prop figure figure--female" transform="translate(400,85)" filter="url(#femaleGlow)">
      <!-- torso, hunched back -->
      <ellipse class="body" cx="-6" cy="-6" rx="9" ry="14" transform="rotate(-12 -6 -6)" />
      <!-- hip/seat resting on the ground -->
      <ellipse class="body" cx="-2" cy="13" rx="12" ry="6" />
      <!-- shin/arm mass blending seat into knees -->
      <ellipse class="body" cx="5" cy="7" rx="7.5" ry="7" />
      <!-- knees drawn up to chest -->
      <ellipse class="body" cx="9" cy="-4" rx="7" ry="11" transform="rotate(12 9 -4)" />
      <!-- head -->
      <circle class="head" cx="-3" cy="-24" r="6.5" />
      <!-- hair, back strand -->
      <path class="hair" d="M -8,-27 C -14,-22 -16,-10 -13,2 C -12,7 -10,10 -7,11 C -9,5 -9,-6 -7,-16 C -6,-20 -6,-24 -8,-27 Z" />
      <!-- hair, front strand -->
      <path class="hair" d="M 2,-27 C 6,-23 7,-15 6,-4 C 5.7,-1 5,1 4,2 C 5,-2 5,-9 4,-15 C 3.5,-19 3.5,-23 2,-27 Z" />
    </g>
  </svg>

  <script src="stars-sky.js?v=6"></script>
</body>
</html>
