<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Night Sky</title>
  <link rel="stylesheet" href="style.css?v=16">
</head>
<body>
  <canvas id="sky-canvas"></canvas>

  <div class="shooting-star-container">
    <div class="shooting_star" style="top: 10%; left: -20%; animation-delay: 0.2s;"></div>
    <div class="shooting_star" style="top: 30%; left: -10%; animation-delay: 1.5s;"></div>
    <div class="shooting_star" style="top: 50%; left: -30%; animation-delay: 2.8s;"></div>
    <div class="shooting_star" style="top: 20%; left: 0%; animation-delay: 1.0s;"></div>
    <div class="shooting_star" style="top: 40%; left: -15%; animation-delay: 3.5s;"></div>
    <div class="shooting_star" style="top: 60%; left: -25%; animation-delay: 0.8s;"></div>
  </div>

  <svg class="hill-scene" viewBox="0 0 800 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="figureGlow" x="-200%" y="-200%" width="500%" height="500%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="blur1">
          <animate attributeName="stdDeviation" values="1.6;2.6;1.6" dur="2.6s" repeatCount="indefinite" />
        </feGaussianBlur>
        <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur2">
          <animate attributeName="stdDeviation" values="4;5.6;4" dur="2.6s" repeatCount="indefinite" />
        </feGaussianBlur>
        <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur3">
          <animate attributeName="stdDeviation" values="7;9.5;7" dur="2.6s" repeatCount="indefinite" />
        </feGaussianBlur>
        <feMerge>
          <feMergeNode in="blur3" />
          <feMergeNode in="blur2" />
          <feMergeNode in="blur1" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>

    <!-- Rolling hill silhouette -->
    <path class="hill" d="M0,130 C120,105 220,120 330,108 C420,98 480,118 560,104 C650,89 730,108 800,96 L800,220 L0,220 Z"></path>

    <!-- Detailed multi-stem flower cluster perfectly anchored to the hill surface -->
    <g class="prop flowers" transform="translate(330, 108) scale(0.38)">
      <!-- Stems -->
      <path class="flower-stem" d="M0,110 Q-15,60 -25,25" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" />
      <path class="flower-stem" d="M0,110 Q5,50 10,5" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" />
      <path class="flower-stem" d="M0,110 Q25,60 40,30" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" />

      <!-- Left Flower Head (-25, 25) -->
      <g transform="translate(-25, 25)">
        <circle cx="0" cy="0" r="14" fill="#000" />
        <circle cx="-12" cy="-8" r="9" fill="#000" />
        <circle cx="12" cy="-8" r="9" fill="#000" />
        <circle cx="-14" cy="6" r="9" fill="#000" />
        <circle cx="14" cy="6" r="9" fill="#000" />
        <circle cx="0" cy="-14" r="9" fill="#000" />
        <circle cx="0" cy="0" r="5" fill="#fff" opacity="0.3" />
      </g>

      <!-- Center Flower Head (10, 5) -->
      <g transform="translate(10, 5)">
        <circle cx="0" cy="0" r="15" fill="#000" />
        <circle cx="-13" cy="-8" r="10" fill="#000" />
        <circle cx="13" cy="-8" r="10" fill="#000" />
        <circle cx="-14" cy="7" r="10" fill="#000" />
        <circle cx="14" cy="7" r="10" fill="#000" />
        <circle cx="0" cy="-15" r="10" fill="#000" />
        <circle cx="0" cy="0" r="5" fill="#fff" opacity="0.3" />
      </g>

      <!-- Right Flower Head (40, 30) -->
      <g transform="translate(40, 30)">
        <circle cx="0" cy="0" r="13" fill="#000" />
        <circle cx="-11" cy="-7" r="8" fill="#000" />
        <circle cx="11" cy="-7" r="8" fill="#000" />
        <circle cx="-12" cy="6" r="8" fill="#000" />
        <circle cx="12" cy="6" r="8" fill="#000" />
        <circle cx="0" cy="-13" r="8" fill="#000" />
        <circle cx="0" cy="0" r="4" fill="#fff" opacity="0.3" />
      </g>

      <!-- Foliage / Leaves cluster at the base -->
      <path class="leaf" d="M0,100 C-30,95 -45,70 -35,55 C-25,75 -10,90 0,100 Z" fill="#000" />
      <path class="leaf" d="M0,105 C30,100 50,75 40,60 C25,80 10,95 0,105 Z" fill="#000" />
      <path class="leaf" d="M-10,110 C-40,100 -55,80 -45,65 C-35,80 -20,100 -10,110 Z" fill="#000" />
    </g>

    <!-- Bush -->
    <g class="prop bush" transform="translate(470,112)">
      <circle cx="0" cy="6" r="12" />
      <circle cx="-11" cy="10" r="9" />
      <circle cx="11" cy="10" r="9" />
      <circle cx="0" cy="-4" r="9" />
    </g>

    <!-- Glowing couple figures -->
    <image href="figures.png" x="365" y="49.3" width="70" height="56" filter="url(#figureGlow)" />
  </svg>

  <script src="stars-sky.js?v=16"></script>
  <script src="floating-texts.js?v=3"></script>
</body>
</html>
